interface:
  display_name: "Remote"
  short_description: "当用户需要远程访问 Linux 服务器、复用本地保存的服务器记录或并行采集远程命令输出时触发"
  default_prompt: "先检查本地 bootstrap-state.json；若状态文件显示当前运行时对应的 sshpass 已可用，则直接进入理解用户需求阶段。若状态文件缺失、显示未安装，或与当前运行时不一致，再参考 references/setup.md 复核并执行 setup。之后检查 servers.json 是否已有服务器记录；未命中时立即询问地址、用户名和密码，端口默认 22。Windows 下执行远程命令必须调用 scripts/remote.ps1，由它内部识别当前 bash 是 WSL 还是 MSYS，再固定转发到 bash -lc 并注入运行标记；不要在 PowerShell 中裸跑 sshpass，也不要在 Windows 下直接执行 remote.sh。只有手工直连时才允许使用带 REMOTE_BASH_LC=1 的 bash -lc 调用。诊断类任务遵循 references/remote-guidelines.md。"
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - sshpass
