interface:
  display_name: "Mindmap"
  short_description: "当用户需要把内容生成思维导图、流程图或结构图时触发"
  default_prompt: "优先检查全局初始化标志文件；仅当标志文件不存在，或 markmap-mcp-server 调用出现环境类错误时，才参考 references/bootstrap.md 执行 bootstrap。bootstrap 修复后只重试一次。"
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - markmap-mcp-server
